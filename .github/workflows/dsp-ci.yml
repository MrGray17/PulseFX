name: DSP CI

on:
  push:
    paths:
      - 'engine/**'
      - 'windows/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'windows/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            relay: OFF
          - os: windows-latest
            relay: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULSEFX_BUILD_WASAPI_RELAY=${{ matrix.relay }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
