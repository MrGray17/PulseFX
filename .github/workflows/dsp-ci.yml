name: PulseFX CI

on:
  push:
    paths:
      - 'engine/**'
      - 'windows/**'
      - 'app/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'windows/**'
      - 'app/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            relay: OFF
          - os: windows-latest
            relay: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULSEFX_BUILD_WASAPI_RELAY=${{ matrix.relay }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  driver:
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate PulseFX virtual audio driver
        shell: pwsh
        run: ./windows/driver/build-driver-ci.ps1 -Configuration Release -Platform ${{ matrix.platform }}
      - name: Verify driver package
        shell: pwsh
        run: |
          $root = 'windows/driver/out-ci'
          $sys = Get-ChildItem -Path $root -Filter '*.sys' | Select-Object -First 1
          $inf = Get-ChildItem -Path $root -Filter '*.inf' | Select-Object -First 1
          $cat = Get-ChildItem -Path $root -Filter '*.cat' | Select-Object -First 1
          if (-not $sys) { throw 'Virtual audio driver .sys was not produced.' }
          if (-not $inf) { throw 'Virtual audio driver .inf was not produced.' }
          if (-not $cat) { throw 'Virtual audio driver catalog was not produced.' }
          $manifest = Get-Content -Raw (Join-Path $root 'PULSEFX_BUILD.txt')
          if (-not $manifest.Contains('render_formats=stereo,5.1-surround,7.1-surround')) {
            throw 'Driver manifest does not declare the multichannel format matrix.'
          }
          if (-not $manifest.Contains('platform=${{ matrix.platform }}')) {
            throw 'Driver manifest platform does not match the CI matrix.'
          }
      - name: Upload unsigned driver package
        uses: actions/upload-artifact@v4
        with:
          name: pulsefx-virtual-audio-driver-${{ matrix.platform }}-unsigned
          path: windows/driver/out-ci/**
          if-no-files-found: error
          retention-days: 7

  quality-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test A/B reference analyzer
        run: python tools/tests/test_audio_lab.py

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Electron main process
        run: node --check electron/main.cjs
      - name: Check Electron preload
        run: node --check electron/preload.cjs
      - name: Check AutoEq service
        run: node --check electron/autoeq.cjs
      - name: Test AutoEq parsing and native payloads
        run: node electron/autoeq.test.cjs
      - name: Build renderer
        run: npm run build

  package-windows:
    runs-on: windows-latest
    needs: [native, driver, desktop, quality-lab]
    steps:
      - uses: actions/checkout@v4
      - name: Configure native Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPULSEFX_BUILD_WASAPI_RELAY=ON
      - name: Build native Release host
        run: cmake --build build --config Release --target pulsefx_audio_host
      - name: Install desktop dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build NSIS installer
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Verify packaged native host
        shell: pwsh
        run: |
          $hostPath = 'app/release/win-unpacked/resources/native/pulsefx_audio_host.exe'
          if (-not (Test-Path $hostPath)) { throw "Packaged native host is missing: $hostPath" }
          $installer = Get-ChildItem -Path 'app/release' -Filter 'PulseFX-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'PulseFX installer was not produced.' }
          Write-Host "Validated installer: $($installer.FullName)"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pulsefx-windows-installer
          path: app/release/PulseFX-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
