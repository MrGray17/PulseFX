name: DSP CI

on:
  push:
    paths:
      - 'engine/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
