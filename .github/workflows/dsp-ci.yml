name: PulseFX CI

on:
  push:
    paths:
      - 'engine/**'
      - 'windows/**'
      - 'app/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'windows/**'
      - 'app/**'
      - 'CMakeLists.txt'
      - '.github/workflows/dsp-ci.yml'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            relay: OFF
          - os: windows-latest
            relay: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPULSEFX_BUILD_WASAPI_RELAY=${{ matrix.relay }}
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Electron main process
        run: node --check electron/main.cjs
      - name: Check Electron preload
        run: node --check electron/preload.cjs
      - name: Build renderer
        run: npm run build
